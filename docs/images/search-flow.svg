<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Search: the typed words, an optional query vector, one Solr request, results that open in the gallery">
  <rect x="0.5" y="0.5" width="1199" height="439" fill="#ffffff" stroke="#d9d4cc"/>
  <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="30" y="70" width="250" height="130" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="50" y="104" font-size="16" font-weight="700" letter-spacing="1.3" fill="#4a4540">YOU TYPE</text>
    <text x="50" y="148" font-size="22" font-weight="700" fill="#111111">dog on the beach</text>
    <text x="50" y="178" font-size="16" fill="#4a4540">plus any filters</text>

    <line x1="284" y1="135" x2="312" y2="135" stroke="#c05520" stroke-width="2"/>
    <path d="M320 135 L308 128 L308 142 Z" fill="#c05520"/>

    <rect x="322" y="70" width="250" height="130" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="342" y="104" font-size="19" font-weight="700" fill="#111111">embed</text>
    <text x="342" y="130" font-size="16" fill="#c05520">api.opensolr.com</text>
    <text x="342" y="158" font-size="16" fill="#4a4540">words to a query vector</text>
    <text x="342" y="182" font-size="16" fill="#4a4540">vector search plans only</text>

    <line x1="576" y1="135" x2="604" y2="135" stroke="#c05520" stroke-width="2"/>
    <path d="M612 135 L600 128 L600 142 Z" fill="#c05520"/>

    <rect x="614" y="40" width="320" height="190" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="634" y="74" font-size="19" font-weight="700" fill="#111111">One POST to /select</text>
    <text x="634" y="108" font-size="16" fill="#111111">lex: edismax on the words</text>
    <text x="634" y="134" font-size="16" fill="#111111">vec: knn on the embeddings</text>
    <text x="634" y="160" font-size="16" fill="#111111">q: bool of lex and vec</text>
    <text x="634" y="186" font-size="16" fill="#111111">fq: year, folder, camera</text>
    <text x="634" y="212" font-size="16" fill="#111111">facets feed the filters</text>

    <line x1="938" y1="135" x2="966" y2="135" stroke="#111111" stroke-width="1.5"/>
    <path d="M974 135 L962 128 L962 142 Z" fill="#111111"/>

    <rect x="976" y="70" width="194" height="130" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="996" y="104" font-size="19" font-weight="700" fill="#111111">Photo grid</text>
    <text x="996" y="140" font-size="16" fill="#4a4540">tap: gallery app</text>
    <text x="996" y="166" font-size="16" fill="#4a4540">hold: details</text>

    <line x1="30" y1="272" x2="1170" y2="272" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="30" y="312" font-size="17" fill="#111111">What you type only travels as the bound parameter uq, and every filter value through {!term} with a</text>
    <text x="30" y="338" font-size="17" fill="#111111">bound value, so no input can change the query itself.</text>
    <text x="30" y="382" font-size="17" fill="#4a4540">Empty search box: every photo, newest first. No vector search on the plan, or its AI requests used up:</text>
    <text x="30" y="408" font-size="17" fill="#4a4540">the same request without vec, and the app says so above the results.</text>
  </g>
</svg>
