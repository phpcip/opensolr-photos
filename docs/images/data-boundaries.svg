<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Where each piece of data lives: the phone, opensolr.com, api.opensolr.com and your Opensolr Index">
  <rect x="0.5" y="0.5" width="1199" height="519" fill="#ffffff" stroke="#d9d4cc"/>
  <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="30" y="40" width="320" height="420" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="54" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#4a4540">YOUR PHONE</text>
    <line x1="54" y1="94" x2="326" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="54" y="124" width="8" height="8" fill="#111111"/>
    <text x="74" y="134" font-size="17" fill="#111111">Original photos, full size</text>
    <rect x="54" y="172" width="8" height="8" fill="#111111"/>
    <text x="74" y="182" font-size="17" fill="#111111">EXIF and GPS read here</text>
    <rect x="54" y="220" width="8" height="8" fill="#111111"/>
    <text x="74" y="230" font-size="17" fill="#111111">API key, Keystore-encrypted</text>
    <rect x="54" y="268" width="8" height="8" fill="#111111"/>
    <text x="74" y="278" font-size="17" fill="#111111">Label and vector cache</text>
    <rect x="54" y="316" width="8" height="8" fill="#111111"/>
    <text x="74" y="326" font-size="17" fill="#111111">Thumbnails, from the phone</text>
    <text x="54" y="432" font-size="16" fill="#4a4540">excluded from phone backups</text>

    <rect x="440" y="40" width="320" height="190" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="464" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#4a4540">OPENSOLR.COM</text>
    <line x1="464" y1="94" x2="736" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="464" y="132" font-size="17" fill="#111111">Sign-in and approval</text>
    <text x="464" y="164" font-size="17" fill="#111111">Create index, upload config</text>
    <text x="464" y="196" font-size="17" fill="#111111">Plan limits and usage</text>

    <rect x="440" y="300" width="320" height="160" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="464" y="338" font-size="16" font-weight="700" letter-spacing="1.3" fill="#c05520">API.OPENSOLR.COM</text>
    <line x1="464" y1="354" x2="736" y2="354" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="464" y="390" font-size="17" fill="#111111">CLIP on a 640 px copy</text>
    <text x="464" y="420" font-size="17" fill="#111111">Vectors of the labels</text>
    <text x="464" y="448" font-size="17" font-weight="700" fill="#c05520">Nothing stored</text>

    <rect x="850" y="40" width="320" height="420" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="874" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#c05520">YOUR OPENSOLR INDEX</text>
    <line x1="874" y1="94" x2="1146" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="874" y="124" width="8" height="8" fill="#c05520"/>
    <text x="894" y="134" font-size="17" fill="#111111">Labels (the meaning)</text>
    <rect x="874" y="172" width="8" height="8" fill="#c05520"/>
    <text x="894" y="182" font-size="17" fill="#111111">Search vector</text>
    <rect x="874" y="220" width="8" height="8" fill="#c05520"/>
    <text x="894" y="230" font-size="17" fill="#111111">Date, camera, place</text>
    <rect x="874" y="268" width="8" height="8" fill="#c05520"/>
    <text x="894" y="278" font-size="17" fill="#111111">Path, folder, size</text>
    <rect x="874" y="316" width="8" height="8" fill="#c05520"/>
    <text x="894" y="326" font-size="17" fill="#111111">Removed with the photo</text>
    <text x="874" y="432" font-size="16" fill="#4a4540">one per phone, in your account</text>

    <line x1="354" y1="135" x2="428" y2="135" stroke="#111111" stroke-width="1.5"/>
    <path d="M436 135 L424 128 L424 142 Z" fill="#111111"/>
    <line x1="354" y1="380" x2="428" y2="380" stroke="#c05520" stroke-width="2"/>
    <path d="M436 380 L424 373 L424 387 Z" fill="#c05520"/>
    <line x1="354" y1="265" x2="838" y2="265" stroke="#111111" stroke-width="1.5"/>
    <path d="M846 265 L834 258 L834 272 Z" fill="#111111"/>
    <text x="600" y="256" font-size="16" fill="#4a4540" text-anchor="middle">direct to Solr: HTTPS + index password</text>

    <text x="30" y="500" font-size="16" fill="#4a4540">Every arrow is HTTPS. The app sends nothing to any other host: no analytics, no ads, no crash reporting.</text>
  </g>
</svg>
