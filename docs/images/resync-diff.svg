<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Re-Sync compares the ids on the phone with the ids in the index">
  <rect x="0.5" y="0.5" width="1199" height="499" fill="#ffffff" stroke="#d9d4cc"/>
  <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="40" y="40" width="340" height="340" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="64" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#4a4540">ON THE PHONE</text>
    <line x1="64" y1="94" x2="356" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="64" y="132" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">a1f3…  IMG_0001.jpg</text>
    <text x="64" y="180" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">b72c…  IMG_0002.jpg</text>
    <text x="64" y="228" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">c9d0…  IMG_0003.jpg</text>
    <text x="64" y="276" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">e41b…  IMG_0005.jpg</text>
    <text x="64" y="352" font-size="16" fill="#4a4540">fresh scan of your folders</text>

    <rect x="430" y="40" width="340" height="340" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="454" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#4a4540">IN THE INDEX</text>
    <line x1="454" y1="94" x2="746" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="454" y="132" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">a1f3…</text>
    <text x="454" y="180" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">b72c…</text>
    <text x="454" y="228" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">d5e6…</text>
    <text x="454" y="352" font-size="16" fill="#4a4540">fetched 1000 ids at a time</text>

    <rect x="820" y="40" width="340" height="340" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="844" y="78" font-size="16" font-weight="700" letter-spacing="1.3" fill="#c05520">RE-SYNC DOES</text>
    <line x1="844" y1="94" x2="1136" y2="94" stroke="#d9d4cc" stroke-width="1.5"/>
    <text x="844" y="132" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">a1f3…</text>
    <text x="1136" y="132" font-size="17" fill="#4a4540" text-anchor="end">keep</text>
    <text x="844" y="180" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">b72c…</text>
    <text x="1136" y="180" font-size="17" fill="#4a4540" text-anchor="end">keep</text>
    <text x="844" y="228" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">c9d0…</text>
    <text x="1136" y="228" font-size="17" font-weight="700" fill="#c05520" text-anchor="end">add</text>
    <text x="844" y="276" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">e41b…</text>
    <text x="1136" y="276" font-size="17" font-weight="700" fill="#c05520" text-anchor="end">add</text>
    <text x="844" y="324" font-size="17" font-family="Menlo, Consolas, monospace" fill="#111111">d5e6…</text>
    <text x="1136" y="324" font-size="17" font-weight="700" fill="#111111" text-anchor="end">delete</text>

    <text x="40" y="430" font-size="17" fill="#111111">id = md5 of the photo's absolute path, built by one function for the phone and for the index.</text>
    <text x="40" y="462" font-size="17" fill="#4a4540">A first Sync is the same comparison with an empty index: everything on the phone is added.</text>
  </g>
</svg>
