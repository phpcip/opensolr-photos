<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 480" role="img" aria-label="How a photo becomes searchable: phone, photos_ingest, your index, search">
  <rect x="0.5" y="0.5" width="1229" height="479" fill="#ffffff" stroke="#d9d4cc"/>
  <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="17" font-weight="700" letter-spacing="1.5" fill="#4a4540">HOW A PHOTO BECOMES SEARCHABLE</text>

    <rect x="40" y="84" width="212" height="206" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="58" y="120" font-size="20" font-weight="700" fill="#111111">On the phone</text>
    <text x="58" y="146" font-size="17" fill="#4a4540">the app</text>
    <text x="58" y="186" font-size="17" fill="#111111">Photo in a folder</text>
    <text x="58" y="212" font-size="17" fill="#111111">EXIF read here</text>
    <text x="58" y="238" font-size="17" fill="#111111">640 px copy made</text>
    <text x="58" y="264" font-size="17" fill="#c05520">Keeps a copy of the index</text>

    <line x1="256" y1="172" x2="276" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M282 172 L270 165 L270 179 Z" fill="#c05520"/>

    <rect x="284" y="84" width="212" height="176" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="302" y="120" font-size="20" font-weight="700" fill="#111111">photos_ingest</text>
    <text x="302" y="146" font-size="17" fill="#c05520">api.opensolr.com</text>
    <text x="302" y="186" font-size="17" fill="#111111">CLIP reads the copy</text>
    <text x="302" y="212" font-size="17" fill="#111111">Five photos per call</text>
    <text x="302" y="238" font-size="17" fill="#111111">Copy not stored</text>

    <line x1="500" y1="172" x2="520" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M526 172 L514 165 L514 179 Z" fill="#c05520"/>

    <rect x="528" y="84" width="212" height="176" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="546" y="120" font-size="20" font-weight="700" fill="#111111">The server writes</text>
    <text x="546" y="146" font-size="17" fill="#c05520">api.opensolr.com</text>
    <text x="546" y="186" font-size="17" fill="#111111">Words to a vector</text>
    <text x="546" y="212" font-size="17" fill="#111111">Place from the GPS</text>
    <text x="546" y="238" font-size="17" fill="#111111">Duplicate keys</text>

    <line x1="744" y1="172" x2="764" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M770 172 L758 165 L758 179 Z" fill="#c05520"/>

    <rect x="772" y="84" width="212" height="206" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="790" y="120" font-size="20" font-weight="700" fill="#111111">Your index</text>
    <text x="790" y="146" font-size="17" fill="#4a4540">Solr, direct</text>
    <text x="790" y="176" font-size="17" fill="#111111">One complete document</text>
    <text x="790" y="199" font-size="17" fill="#111111">Words and vector</text>
    <text x="790" y="222" font-size="17" fill="#111111">Printed text, people</text>
    <text x="790" y="245" font-size="17" fill="#111111">Your tags and wording</text>
    <text x="790" y="268" font-size="17" fill="#111111">Date, camera, place</text>

    <line x1="988" y1="172" x2="1008" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M1014 172 L1002 165 L1002 179 Z" fill="#c05520"/>

    <rect x="1016" y="84" width="174" height="206" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="1034" y="120" font-size="20" font-weight="700" fill="#111111">Search</text>
    <text x="1034" y="146" font-size="17" fill="#4a4540">the app</text>
    <text x="1034" y="186" font-size="17" fill="#111111">Words, meaning</text>
    <text x="1034" y="212" font-size="17" fill="#111111">Filters</text>
    <text x="1034" y="238" font-size="17" fill="#111111">Opens in gallery</text>
    <text x="1034" y="264" font-size="17" fill="#c05520">Browsing: the copy</text>

    <rect x="40" y="300" width="560" height="140" rx="2" fill="#ffffff" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="40" y="300" width="3" height="140" fill="#c05520"/>
    <text x="64" y="340" font-size="18" font-weight="700" fill="#111111">Paid for once per photo</text>
    <text x="64" y="372" font-size="17" fill="#4a4540">Opensolr keeps what a picture was read as,</text>
    <text x="64" y="398" font-size="17" fill="#4a4540">so a photo sent again costs nothing again.</text>
    <text x="64" y="424" font-size="17" fill="#4a4540">Ten photos read count as one AI request.</text>

    <rect x="630" y="300" width="560" height="140" rx="2" fill="#ffffff" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="630" y="300" width="3" height="140" fill="#111111"/>
    <text x="654" y="340" font-size="18" font-weight="700" fill="#111111">The copy carries nothing else</text>
    <text x="654" y="372" font-size="17" fill="#4a4540">Re-encoded from pixels, with only the tags the</text>
    <text x="654" y="398" font-size="17" fill="#4a4540">reader needs: time, camera, exposure, position.</text>
    <text x="654" y="424" font-size="17" fill="#4a4540">Nothing else from the original travels with it.</text>
  </g>
</svg>
