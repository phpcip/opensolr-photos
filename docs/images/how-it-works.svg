<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" role="img" aria-label="How a photo becomes searchable: the phone, photos_ingest, your index, the phone's copy of the index, browsing and search">
  <rect x="0.5" y="0.5" width="1229" height="519" fill="#ffffff" stroke="#d9d4cc"/>
  <g font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="16" font-weight="700" letter-spacing="1.5" fill="#4a4540">HOW A PHOTO BECOMES SEARCHABLE</text>

    <rect x="40" y="84" width="268" height="176" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="58" y="120" font-size="20" font-weight="700" fill="#111111">On the phone</text>
    <text x="58" y="146" font-size="16" fill="#4a4540">the app</text>
    <text x="58" y="186" font-size="16" fill="#111111">Photo in a folder</text>
    <text x="58" y="212" font-size="16" fill="#111111">EXIF and md5 read here</text>
    <text x="58" y="238" font-size="16" fill="#111111">640 px copy made</text>

    <line x1="312" y1="172" x2="332" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M338 172 L326 165 L326 179 Z" fill="#c05520"/>

    <rect x="340" y="84" width="268" height="176" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="358" y="120" font-size="20" font-weight="700" fill="#111111">photos_ingest</text>
    <text x="358" y="146" font-size="16" fill="#c05520">api.opensolr.com</text>
    <text x="358" y="186" font-size="16" fill="#111111">Words, vector, place</text>
    <text x="358" y="212" font-size="16" fill="#111111">Printed text when there is any</text>
    <text x="358" y="238" font-size="16" fill="#111111">Copy not stored</text>

    <line x1="612" y1="172" x2="632" y2="172" stroke="#c05520" stroke-width="2"/>
    <path d="M638 172 L626 165 L626 179 Z" fill="#c05520"/>

    <rect x="640" y="84" width="268" height="176" rx="2" fill="#ffffff" stroke="#c05520" stroke-width="2"/>
    <text x="658" y="120" font-size="20" font-weight="700" fill="#111111">Your index</text>
    <text x="658" y="146" font-size="16" fill="#c05520">written by the server</text>
    <text x="658" y="186" font-size="16" fill="#111111">The whole document</text>
    <text x="658" y="212" font-size="16" fill="#111111">Search vector</text>
    <text x="658" y="238" font-size="16" fill="#111111">Duplicate keys</text>

    <line x1="912" y1="172" x2="932" y2="172" stroke="#111111" stroke-width="1.5"/>
    <path d="M938 172 L926 165 L926 179 Z" fill="#111111"/>

    <rect x="940" y="84" width="250" height="176" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="958" y="120" font-size="20" font-weight="700" fill="#111111">The phone's copy</text>
    <text x="958" y="146" font-size="16" fill="#4a4540">kept in step by every write</text>
    <text x="958" y="186" font-size="16" fill="#111111">Same fields, no vector</text>
    <text x="958" y="212" font-size="16" fill="#111111">No duplicate keys</text>
    <text x="958" y="238" font-size="16" fill="#111111">Read down once, at install</text>

    <rect x="40" y="300" width="560" height="180" rx="2" fill="#ffffff" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="40" y="300" width="3" height="180" fill="#111111"/>
    <text x="64" y="340" font-size="18" font-weight="700" fill="#111111">Answered on the phone</text>
    <text x="64" y="372" font-size="16" fill="#4a4540">Browsing by year, month and day, the counts,</text>
    <text x="64" y="398" font-size="16" fill="#4a4540">the photos in a day, tag and name suggestions,</text>
    <text x="64" y="424" font-size="16" fill="#4a4540">the sync's comparison, the document read back</text>
    <text x="64" y="450" font-size="16" fill="#4a4540">before an edit. No request at all.</text>

    <rect x="630" y="300" width="560" height="180" rx="2" fill="#ffffff" stroke="#d9d4cc" stroke-width="1.5"/>
    <rect x="630" y="300" width="3" height="180" fill="#c05520"/>
    <text x="654" y="340" font-size="18" font-weight="700" fill="#111111">Still asked of the index</text>
    <text x="654" y="372" font-size="16" fill="#4a4540">A typed search and the vector of what you typed,</text>
    <text x="654" y="398" font-size="16" fill="#4a4540">the filter lists (once, until a sync writes),</text>
    <text x="654" y="424" font-size="16" fill="#4a4540">duplicates, albums, the map, and every write.</text>
    <text x="654" y="450" font-size="16" fill="#4a4540">Words you edit go up with no picture attached.</text>
  </g>
</svg>
